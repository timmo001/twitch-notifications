# Keeps the docs dev server, a local daemon and the development panel running
# in the background, outside the invoking shell or agent. Manage them with the
# serve:* and dev:* mise tasks.

# Uses its own socket so it never replaces the installed service's socket.
# BUN_GC_TIMER_INTERVAL matches the installed service, so it idles the same way.
[daemons.daemon]
run = 'UPNEXT_SOCK="$XDG_RUNTIME_DIR/upnext/dev.sock" BUN_GC_TIMER_INTERVAL=5000 exec bun run --watch src/index.ts serve'
retry = true

[daemons.panel]
run = ".scripts/linux/pitchfork-panel-dev.sh"
ready_delay = 1

[daemons.docs]
run = 'exec mise run docs:dev --host 127.0.0.1 --port "$PORT"'
port = { expect = [7390], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
retry = true
