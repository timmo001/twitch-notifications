---
name: Publish private rolling Arch package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Request rolling package publish
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh api repos/timmo001/private-arch-repo/dispatches \
            --method POST \
            --raw-field event_type=publish-package \
            --raw-field "client_payload[repository]=$GITHUB_REPOSITORY" \
            --raw-field "client_payload[sha]=$GITHUB_SHA" \
            --raw-field "client_payload[package_name]=twitch-notifications-git" \
            --raw-field "client_payload[previous_package_name]=twitch-notifications"
