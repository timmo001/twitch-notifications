min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.3"
pitchfork = "2.30.1"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run upnext in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile a minified, bytecode-cached upnext binary"
depends = ["install"]
run = "bun run build"

[tasks."build:packages"]
description = "Build the publishable packages into their dist directories"
depends = ["install"]
run = "bun run build:packages"

[tasks."version:sync"]
description = "Pin each package's @timmo001/effect-upnext-shared dependency to the shared release version"
run = '''
version="$(bun pm pkg get version | tr -d '"')"
for package in packages/twitch packages/youtube packages/client; do
  (cd "$package" && bun pm pkg set "dependencies.@timmo001/effect-upnext-shared=$version")
done
'''

[tasks.typecheck]
description = "Type-check the source"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run tests"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, and verify formatting"
depends = ["lint", "typecheck", "format:check"]

[tasks."docs:gen"]
description = "Regenerate the docs command reference from the CLI's help"
depends = ["install"]
run = "bun scripts/generate-cli-reference.ts"

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["docs:install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."serve:daemon"]
description = "Start a local daemon in watch mode in the background through Pitchfork"
depends = ["install"]
run = "pitchfork start daemon"

[tasks."serve:daemon:status"]
description = "Show the background local daemon status"
run = "pitchfork status daemon"

[tasks."serve:daemon:logs"]
description = "Follow the background local daemon logs"
run = "pitchfork logs -t daemon"

[tasks."serve:daemon:restart"]
description = "Restart the background local daemon"
run = "pitchfork restart daemon"

[tasks."serve:daemon:stop"]
description = "Stop the background local daemon"
run = "pitchfork stop daemon"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."dev:start"]
description = "Start the local daemon and panel, then open the panel"
depends = ["install"]
run = "pitchfork start --force daemon panel && omarchy restart shell && omarchy-shell timmo.upnext open"

[tasks."dev:status"]
description = "Show the local daemon and panel status"
run = "pitchfork status daemon && pitchfork status panel"

[tasks."dev:logs"]
description = "Follow the local daemon and panel logs"
run = "pitchfork logs -t daemon panel"

[tasks."dev:restart"]
description = "Restart the local daemon and panel, then open the panel"
run = "pitchfork restart daemon panel && omarchy restart shell && omarchy-shell timmo.upnext open"

[tasks."dev:stop"]
description = "Stop the local daemon and panel and restore the installed panel"
run = "pitchfork stop panel daemon && omarchy restart shell"
